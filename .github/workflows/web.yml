name: Website

on:
  push:
    branches: [main]
    paths: ['web/**', 'supabase/migrations/**', 'supabase/tests/supabase-shim.sql', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'supabase/migrations/**', 'supabase/tests/supabase-shim.sql', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install a browser for the browser tests
        run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
