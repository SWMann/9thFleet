name: Database

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/database.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/database.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations and access rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - run: npm ci
      - run: npm test
